services:
  falkordb:
    # Pinned to v4.x: graphiti-core's Cypher calls db.idx.fulltext.createNodeIndex
    # with 5 positional args, which v6's FalkorDB module signature rejects
    # ("expected at most 1"). Do not bump to :latest without re-checking that
    # upstream graphiti-core has migrated its index-creation calls for v6.
    image: falkordb/falkordb:v4.22.0
    restart: unless-stopped
    # No host port here -- falkordb-browser below is the one UI onto this
    # database, reached through the admin panel; nothing else needs a direct
    # connection to FalkorDB from outside the docker network.
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Official FalkorDB Browser (cloned to ./repo-browser by
  # scripts/bootstrap.sh) -- this is the real app's own graph visualization,
  # not a reimplementation. One source line is patched (see
  # scripts/patch-browser-frame-embed.sh: upstream's hardcoded
  # X-Frame-Options: DENY -> a CSP frame-ancestors scoped to the admin
  # panel's own origin, so the admin panel can embed this app's graph page
  # in an <iframe>). Everything else uses existing, documented features
  # with zero source changes:
  #   - FALKORDB_HOST/PORT + FALKORDB_AUTO_CONNECT=true (lib/
  #     preconfiguredConnection.ts) skip its login form entirely and connect
  #     straight to our falkordb service -- the operator never sees or types
  #     a connection.
  #   - its own "share a link" feature reads ?graph=<name> off the URL
  #     (lib/graphTabs.ts: parseSharedTab) to open directly on one graph.
  #     The admin panel's embedded iframe src is exactly such a URL --
  #     http://<host>:${FALKORDB_BROWSER_PORT}/graph?graph=<group_id>.
  falkordb-browser:
    build:
      context: ./repo-browser
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_AUTO_CONNECT=true
      # Auth.js (NextAuth v5) derives trustHost from AUTH_URL -- the
      # Dockerfile already sets AUTH_TRUST_HOST=true, this supplies the URL
      # it trusts. Must match how the admin panel's links reach this
      # service (same host, this port).
      - AUTH_URL=http://${PUBLIC_HOST:-localhost}:${FALKORDB_BROWSER_PORT:-3002}
    ports:
      - "${FALKORDB_BROWSER_PORT:-3002}:3000"

  graphiti-mcp:
    build:
      # mcp_server/docker/Dockerfile.standalone -- the MCP server alone,
      # talking to an EXTERNAL FalkorDB (ours, pinned below). The *other*
      # Dockerfile in that directory bundles its own embedded FalkorDB
      # :latest image, which is both redundant with our pinned falkordb
      # service and would silently reintroduce the v6 index-procedure
      # incompatibility this pin exists to avoid.
      context: ./repo/mcp_server
      dockerfile: docker/Dockerfile.standalone
      args:
        # Upstream Dockerfile pins 0.29.1, which predates the
        # OpenAIGenericClient(structured_output_mode=...) kwarg that main's
        # mcp_server code already calls. 0.30.2 is the first graphiti-core
        # release compatible with both.
        GRAPHITI_CORE_VERSION: "0.30.2"
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      # Names here match config/config.yaml's ${VAR:default} expansions in
      # the upstream repo exactly -- see docs/ARCHITECTURE.md for why this
      # matters (the previous names, e.g. FALKORDB_HOST/OPENAI_BASE_URL,
      # aren't read by that file at all and silently fall back to defaults).
      - FALKORDB_URI=redis://falkordb:6379
      - OPENAI_API_KEY=${LLM_API_KEY}
      - OPENAI_API_URL=${LLM_BASE_URL}
      - MODEL_NAME=${LLM_MODEL}
      - EMBEDDER_MODEL=${EMBEDDING_MODEL}
      # Default/fallback group when a request somehow reaches this server
      # without the proxy in front (should not happen in normal operation —
      # the proxy is the only port this compose file exposes publicly).
      - GRAPHITI_GROUP_ID=main
    expose:
      - "8000"

  auth-proxy:
    build: ./services/proxy
    restart: unless-stopped
    depends_on:
      - graphiti-mcp
    environment:
      - UPSTREAM=http://graphiti-mcp:8000
      - AGENT_TOKENS_PATH=/data/agent_tokens.json
      - PROXY_PORT=8080
    volumes:
      - agent_tokens:/data
    ports:
      - "${PROXY_PORT:-8080}:8080"

  vault-service:
    build: ./services/vault
    restart: unless-stopped
    environment:
      - VAULTS_ROOT=/data/vaults
      - AGENT_TOKENS_PATH=/data/tokens/agent_tokens.json
      - VAULT_PORT=8070
    volumes:
      - agent_tokens:/data/tokens:ro
      - ./data/vaults:/data/vaults
    expose:
      - "8070"

  # Per-agent Obsidian vault as a REAL MCP server (read_file/write_file/
  # list_directory/... tools), for a Hermes profile's mcp_servers.obsidian
  # entry -- distinct from vault-service above, which is a REST API for the
  # admin panel's own browser/editor UI, not something a Hermes agent calls
  # as an MCP tool. See services/vault-mcp/supervisor.py for why these are
  # two different services rather than one: @modelcontextprotocol/server-
  # filesystem's root directory is fixed at process launch, so giving two
  # agents two different roots needs one child process each, confined by
  # the OS to its own directory -- not just application-level filtering.
  vault-mcp:
    build: ./services/vault-mcp
    restart: unless-stopped
    environment:
      - VAULTS_ROOT=/data/vaults
      - AGENT_TOKENS_PATH=/data/tokens/agent_tokens.json
      - VAULT_MCP_PORT=8080
    volumes:
      - agent_tokens:/data/tokens:ro
      - ./data/vaults:/data/vaults
    expose:
      - "8080"

  admin:
    build: ./services/admin
    restart: unless-stopped
    depends_on:
      auth-proxy:
        condition: service_started
      vault-service:
        condition: service_started
      falkordb-browser:
        condition: service_started
    environment:
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - AGENT_TOKENS_PATH=/data/agent_tokens.json
      - VAULT_SERVICE_BASE=http://vault-service:8070
      # Reachable from the OPERATOR's own browser, not from inside the
      # docker network -- this becomes an <iframe src> the admin panel
      # hands back to the browser, same as PUBLIC_HOST everywhere else.
      - FALKORDB_BROWSER_BASE=http://${PUBLIC_HOST:-localhost}:${FALKORDB_BROWSER_PORT:-3002}
    volumes:
      - agent_tokens:/data
    ports:
      - "${ADMIN_PORT:-8090}:8090"

volumes:
  falkordb_data:
  agent_tokens:
